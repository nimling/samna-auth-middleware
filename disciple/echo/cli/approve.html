<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sign in the {{.App}} cli</title>
<style>
:root {
  color-scheme: light;
  --auth-ground: #f4f2ec;
  --auth-sheet: #ffffff;
  --auth-ink: #2a2720;
  --auth-ink-muted: #6b665a;
  --auth-ink-faint: #8a8578;
  --auth-accent: #d97757;
  --auth-accent-strong: #c4643f;
  --auth-accent-ink: #2a2720;
  --auth-danger: #b3261e;
  --auth-success: #1d7044;
  --auth-glass: color-mix(in oklab, #ffffff, transparent 32%);
  --auth-glass-field: color-mix(in oklab, #ffffff, transparent 45%);
  --auth-glass-line: color-mix(in oklab, #2a2720, transparent 90%);
  --auth-glass-line-strong: color-mix(in oklab, #2a2720, transparent 82%);
  --auth-glass-sheen: linear-gradient(135deg, color-mix(in oklab, #ffffff, transparent 45%) 0%, transparent 45%, transparent 75%, color-mix(in oklab, #ffffff, transparent 78%) 100%);
  --auth-glass-shadow: 0 0.75em 2em -1em color-mix(in oklab, #2a2720, transparent 80%), 0 0.125em 0.375em -0.125em color-mix(in oklab, #2a2720, transparent 90%);
  --auth-radius-pill: 999em;
  --auth-font: "Inter", system-ui, sans-serif;
  --auth-font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --auth-ease: cubic-bezier(0.4, 0, 0.2, 1);
  --auth-focus: 0 0 0 0.125em var(--auth-accent);
  --cli-ring: transparent;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --auth-ground: #141413;
    --auth-sheet: #262420;
    --auth-ink: #f4f2ec;
    --auth-ink-muted: #b0aea5;
    --auth-ink-faint: #8a8578;
    --auth-accent: #e88b63;
    --auth-accent-strong: #f3af94;
    --auth-accent-ink: #141413;
    --auth-danger: #f28b82;
    --auth-success: #6fcf97;
    --auth-glass: color-mix(in oklab, #262420, transparent 38%);
    --auth-glass-field: color-mix(in oklab, #141413, transparent 55%);
    --auth-glass-line: color-mix(in oklab, #faf9f5, transparent 90%);
    --auth-glass-line-strong: color-mix(in oklab, #faf9f5, transparent 80%);
    --auth-glass-sheen: linear-gradient(135deg, color-mix(in oklab, #faf9f5, transparent 90%) 0%, transparent 42%, transparent 70%, color-mix(in oklab, #faf9f5, transparent 96%) 100%);
    --auth-glass-shadow: 0 1em 2.5em -1.25em color-mix(in oklab, #000000, transparent 40%), 0 0.125em 0.375em -0.125em color-mix(in oklab, #000000, transparent 70%);
  }
}
@media (prefers-reduced-transparency: reduce) {
  :root {
    --auth-glass: var(--auth-sheet);
    --auth-glass-field: var(--auth-sheet);
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { min-block-size: 100%; background: var(--auth-ground); }
body {
  display: grid;
  grid-template-rows: 1fr auto;
  grid-template-columns: minmax(0, 1fr);
  justify-items: center;
  align-items: center;
  min-block-size: 100vh;
  min-block-size: 100dvh;
  margin: 0;
  padding: clamp(1em, 3vw, 2.5em);
  font-family: var(--auth-font);
  line-height: 1.3;
  color: var(--auth-ink);
  background:
    radial-gradient(55% 55% at 18% 22%, color-mix(in oklab, var(--auth-accent), transparent 78%), transparent 70%),
    radial-gradient(50% 60% at 85% 78%, color-mix(in oklab, var(--auth-ink-faint), transparent 80%), transparent 72%),
    var(--auth-ground);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  accent-color: var(--auth-accent);
  caret-color: var(--auth-accent);
}
body[data-state="approved"] { --cli-ring: color-mix(in oklab, var(--auth-success), transparent 25%); }
body[data-state="failed"] { --cli-ring: color-mix(in oklab, var(--auth-danger), transparent 25%); }
p, h1 { margin: 0; }
.cli-dialog {
  position: relative;
  display: grid;
  gap: clamp(1em, 2.5vw, 1.6em);
  inline-size: min(100%, clamp(30rem, 56vw, 46rem));
  padding: clamp(1.75em, 5vw, 3.5em);
  font-size: clamp(1rem, 0.94rem + 0.3vw, 1.125rem);
  background: var(--auth-glass);
  border: thin solid var(--auth-glass-line);
  border-radius: 1.5em;
  box-shadow: var(--auth-glass-shadow), 0 0 0 0.0625em var(--cli-ring), 0 0 2.5em -0.5em var(--cli-ring);
  -webkit-backdrop-filter: blur(1.4em) saturate(1.7);
  backdrop-filter: blur(1.4em) saturate(1.7);
  transition: box-shadow 0.35s var(--auth-ease);
}
.cli-dialog::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--auth-glass-sheen);
  mix-blend-mode: soft-light;
  pointer-events: none;
}
.cli-mark {
  display: inline-flex;
  align-items: center;
  gap: 0.55em;
  justify-self: start;
  padding: 0.3em 0.85em;
  font-size: 0.8em;
  font-weight: 560;
  color: var(--auth-ink-muted);
  background: var(--auth-glass-field);
  border: thin solid var(--auth-glass-line-strong);
  border-radius: var(--auth-radius-pill);
}
.cli-mark::before {
  content: "";
  inline-size: 0.55em;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--auth-accent);
  box-shadow: 0 0 0.8em var(--auth-accent);
}
body[data-state="approved"] .cli-mark::before { background: var(--auth-success); box-shadow: 0 0 0.8em var(--auth-success); }
body[data-state="failed"] .cli-mark::before { background: var(--auth-danger); box-shadow: 0 0 0.8em var(--auth-danger); }
.cli-title {
  font-family: "Bricolage Grotesque", var(--auth-font);
  font-size: clamp(2rem, 1.3rem + 2.6vw, 3.1rem);
  font-weight: 620;
  line-height: 1.02;
  letter-spacing: -0.035em;
  text-wrap: balance;
}
.cli-text {
  max-inline-size: 52ch;
  color: var(--auth-ink-muted);
  text-wrap: pretty;
}
.cli-text code { font-family: var(--auth-font-mono); letter-spacing: 0.12em; color: var(--auth-ink); }
.cli-done, body[data-state="approved"] :is(.cli-pending, form) { display: none; }
body[data-state="approved"] .cli-done { display: revert; }
form { display: grid; gap: clamp(1em, 2.5vw, 1.6em); }
.cli-label {
  display: grid;
  gap: 0.5em;
  font-size: 0.85em;
  font-weight: 560;
  color: var(--auth-ink-faint);
}
.cli-code {
  inline-size: 100%;
  margin: 0;
  padding: 0.55em 0.6em;
  font-family: var(--auth-font-mono);
  font-size: clamp(1.6rem, 1rem + 2.6vw, 2.6rem);
  font-weight: 600;
  letter-spacing: 0.24em;
  text-align: center;
  text-transform: uppercase;
  color: var(--auth-ink);
  background: var(--auth-glass-field);
  border: thin solid var(--auth-glass-line-strong);
  border-radius: 0.3em;
  outline: none;
  transition: border-color 0.2s var(--auth-ease), box-shadow 0.2s var(--auth-ease);
}
.cli-code:focus-visible { border-color: var(--auth-accent); box-shadow: var(--auth-focus); }
.cli-approve {
  inline-size: 100%;
  min-block-size: 3em;
  padding: 0.6em 1.2em;
  font: inherit;
  font-weight: 560;
  color: var(--auth-accent-ink);
  background: var(--auth-accent);
  border: thin solid transparent;
  border-radius: var(--auth-radius-pill);
  cursor: pointer;
  transition: background-color 0.2s var(--auth-ease), box-shadow 0.2s var(--auth-ease);
}
.cli-approve:hover:not(:disabled) { background: var(--auth-accent-strong); }
.cli-approve:focus-visible { outline: none; box-shadow: 0 0 0 0.15em var(--auth-ground), 0 0 0 0.3em var(--auth-accent); }
.cli-approve:disabled { opacity: 0.6; cursor: default; }
#result:empty { display: none; }
body[data-state="failed"] #result { color: var(--auth-danger); }
.cli-footer {
  display: grid;
  justify-items: center;
  gap: 0.25em;
  padding: 1em 0.5em;
  text-align: center;
  color: var(--auth-ink);
}
.cli-rights { font-size: 0.75rem; }
.cli-version { font-size: 0.65rem; opacity: 0.6; }
.cli-countdown { font-family: var(--auth-font-mono); font-size: 0.9em; color: var(--auth-ink-faint); }
@media (prefers-reduced-transparency: reduce) {
  .cli-dialog { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .cli-dialog::before { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .cli-dialog, .cli-code, .cli-approve { transition: none; }
}
</style>
</head>
<body data-state="pending">
<main class="cli-dialog" aria-labelledby="cli-title" aria-live="polite">
<span class="cli-mark">{{.App}} cli</span>
<h1 id="cli-title" class="cli-title"><span class="cli-pending">Sign in the {{.App}} cli</span><span class="cli-done">Approved, return to your terminal</span></h1>
<p class="cli-text cli-pending">Approve only a code your own terminal printed. The cli then acts as you on this server.</p>
<p class="cli-text cli-done">Return to your terminal, the cli now acts as you on this server.</p>
<p id="countdown" class="cli-countdown cli-done" role="status"></p>
<form id="approval">
<label class="cli-label" for="code">Code
<input id="code" class="cli-code" value="{{.Code}}" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
</label>
<button id="approve" class="cli-approve" type="submit">Approve</button>
<p id="result" class="cli-text" role="alert"></p>
</form>
</main>
<footer class="cli-footer">
<span class="cli-rights">© <span id="year"></span> Samna. All rights reserved.</span>

</footer>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
const csrfCookie = {{.CSRFCookie}};
const csrfHeader = {{.CSRFHeader}};
const approvalPath = {{.ApprovalPath}};
const login = {{.Login}};
const closeSeconds = 5;
const closeCheckDelay = 400;
function closeTab() {
  const countdown = document.getElementById("countdown");
  window.close();
  setTimeout(() => {
    if (!window.closed) countdown.textContent = "You can close this tab";
  }, closeCheckDelay);
}
function startCountdown() {
  const countdown = document.getElementById("countdown");
  let seconds = closeSeconds;
  countdown.textContent = "This tab closes in " + seconds + " s";
  const timer = setInterval(() => {
    seconds -= 1;
    if (seconds > 0) {
      countdown.textContent = "This tab closes in " + seconds + " s";
      return;
    }
    clearInterval(timer);
    closeTab();
  }, 1000);
}
document.getElementById("approval").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = document.getElementById("approve");
  const result = document.getElementById("result");
  const code = document.getElementById("code").value;
  const entry = document.cookie.split("; ").find((pair) => pair.startsWith(csrfCookie + "="));
  const token = entry ? decodeURIComponent(entry.slice(csrfCookie.length + 1)) : "";
  button.disabled = true;
  result.textContent = "";
  const response = await fetch(approvalPath, {
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json", [csrfHeader]: token },
    body: JSON.stringify({ login: login, code: code }),
  }).catch(() => null);
  const payload = response ? await response.json().catch(() => ({})) : {};
  button.disabled = false;
  if (response && response.ok) {
    document.getElementById("code").value = "";
    history.replaceState(null, "", location.pathname);
    document.body.dataset.state = "approved";
    startCountdown();
    return;
  }
  document.body.dataset.state = "failed";
  result.textContent = response ? ((payload.error && payload.error.message) || response.statusText) : "The server could not be reached.";
});
</script>
</body>
</html>
