<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sign in to {{.App}} failed</title>
<style>
:root {
  color-scheme: light;
  --auth-ground: #f4f2ec;
  --auth-sheet: #ffffff;
  --auth-ink: #2a2720;
  --auth-ink-muted: #6b665a;
  --auth-ink-faint: #8a8578;
  --auth-accent: #d97757;
  --auth-accent-strong: #c4643f;
  --auth-accent-ink: #2a2720;
  --auth-danger: #b3261e;
  --auth-glass: color-mix(in oklab, #ffffff, transparent 32%);
  --auth-glass-field: color-mix(in oklab, #ffffff, transparent 45%);
  --auth-glass-line: color-mix(in oklab, #2a2720, transparent 90%);
  --auth-glass-line-strong: color-mix(in oklab, #2a2720, transparent 82%);
  --auth-glass-sheen: linear-gradient(135deg, color-mix(in oklab, #ffffff, transparent 45%) 0%, transparent 45%, transparent 75%, color-mix(in oklab, #ffffff, transparent 78%) 100%);
  --auth-glass-shadow: 0 0.75em 2em -1em color-mix(in oklab, #2a2720, transparent 80%), 0 0.125em 0.375em -0.125em color-mix(in oklab, #2a2720, transparent 90%);
  --auth-radius-pill: 999em;
  --auth-font: "Inter", system-ui, sans-serif;
  --auth-font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --auth-ease: cubic-bezier(0.4, 0, 0.2, 1);
  --login-ring: color-mix(in oklab, var(--auth-danger), transparent 25%);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --auth-ground: #141413;
    --auth-sheet: #262420;
    --auth-ink: #f4f2ec;
    --auth-ink-muted: #b0aea5;
    --auth-ink-faint: #8a8578;
    --auth-accent: #e88b63;
    --auth-accent-strong: #f3af94;
    --auth-accent-ink: #141413;
    --auth-danger: #f28b82;
    --auth-glass: color-mix(in oklab, #262420, transparent 38%);
    --auth-glass-field: color-mix(in oklab, #141413, transparent 55%);
    --auth-glass-line: color-mix(in oklab, #faf9f5, transparent 90%);
    --auth-glass-line-strong: color-mix(in oklab, #faf9f5, transparent 80%);
    --auth-glass-sheen: linear-gradient(135deg, color-mix(in oklab, #faf9f5, transparent 90%) 0%, transparent 42%, transparent 70%, color-mix(in oklab, #faf9f5, transparent 96%) 100%);
    --auth-glass-shadow: 0 1em 2.5em -1.25em color-mix(in oklab, #000000, transparent 40%), 0 0.125em 0.375em -0.125em color-mix(in oklab, #000000, transparent 70%);
  }
}
@media (prefers-reduced-transparency: reduce) {
  :root {
    --auth-glass: var(--auth-sheet);
    --auth-glass-field: var(--auth-sheet);
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { min-block-size: 100%; background: var(--auth-ground); }
body {
  display: grid;
  grid-template-rows: 1fr auto;
  grid-template-columns: minmax(0, 1fr);
  justify-items: center;
  align-items: center;
  min-block-size: 100vh;
  min-block-size: 100dvh;
  margin: 0;
  padding: clamp(1em, 3vw, 2.5em);
  font-family: var(--auth-font);
  line-height: 1.3;
  color: var(--auth-ink);
  background:
    radial-gradient(55% 55% at 18% 22%, color-mix(in oklab, var(--auth-danger), transparent 82%), transparent 70%),
    radial-gradient(50% 60% at 85% 78%, color-mix(in oklab, var(--auth-ink-faint), transparent 80%), transparent 72%),
    var(--auth-ground);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
p, h1 { margin: 0; }
.login-dialog {
  position: relative;
  display: grid;
  gap: clamp(1em, 2.5vw, 1.6em);
  inline-size: min(100%, clamp(30rem, 56vw, 46rem));
  padding: clamp(1.75em, 5vw, 3.5em);
  font-size: clamp(1rem, 0.94rem + 0.3vw, 1.125rem);
  background: var(--auth-glass);
  border: thin solid var(--auth-glass-line);
  border-radius: 1.5em;
  box-shadow: var(--auth-glass-shadow), 0 0 0 0.0625em var(--login-ring), 0 0 2.5em -0.5em var(--login-ring);
  -webkit-backdrop-filter: blur(1.4em) saturate(1.7);
  backdrop-filter: blur(1.4em) saturate(1.7);
}
.login-dialog::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--auth-glass-sheen);
  mix-blend-mode: soft-light;
  pointer-events: none;
}
.login-mark {
  display: inline-flex;
  align-items: center;
  gap: 0.55em;
  justify-self: start;
  padding: 0.3em 0.85em;
  font-size: 0.8em;
  font-weight: 560;
  color: var(--auth-ink-muted);
  background: var(--auth-glass-field);
  border: thin solid var(--auth-glass-line-strong);
  border-radius: var(--auth-radius-pill);
}
.login-mark::before {
  content: "";
  inline-size: 0.55em;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--auth-danger);
  box-shadow: 0 0 0.8em var(--auth-danger);
}
.login-title {
  font-family: "Bricolage Grotesque", var(--auth-font);
  font-size: clamp(2rem, 1.3rem + 2.6vw, 3.1rem);
  font-weight: 620;
  line-height: 1.02;
  letter-spacing: -0.035em;
  text-wrap: balance;
}
.login-text {
  max-inline-size: 52ch;
  color: var(--auth-ink-muted);
  text-wrap: pretty;
}
.login-code { font-family: var(--auth-font-mono); font-size: 0.85em; color: var(--auth-danger); overflow-wrap: anywhere; }
.login-out {
  justify-self: start;
  min-block-size: 3em;
  padding: 0.6em 1.4em;
  display: inline-grid;
  align-content: center;
  font: inherit;
  font-weight: 560;
  color: var(--auth-accent-ink);
  background: var(--auth-accent);
  border: thin solid transparent;
  border-radius: var(--auth-radius-pill);
  text-decoration: none;
  transition: background-color 0.2s var(--auth-ease), box-shadow 0.2s var(--auth-ease);
}
.login-out:hover { background: var(--auth-accent-strong); }
.login-out:focus-visible { outline: none; box-shadow: 0 0 0 0.15em var(--auth-ground), 0 0 0 0.3em var(--auth-accent); }
.login-footer {
  display: grid;
  justify-items: center;
  gap: 0.25em;
  padding: 1em 0.5em;
  text-align: center;
  color: var(--auth-ink);
}
.login-rights { font-size: 0.75rem; }
@media (prefers-reduced-transparency: reduce) {
  .login-dialog { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .login-dialog::before { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .login-out { transition: none; }
}
</style>
</head>
<body>
<main class="login-dialog" aria-labelledby="login-title">
<span class="login-mark">{{.App}}</span>
<h1 id="login-title" class="login-title">The sign in did not complete</h1>
<p class="login-text">{{.Description}}</p>
<p class="login-code">{{.Error}}</p>
<a class="login-out" href="{{.Logout}}">Sign out and start again</a>
</main>
<footer class="login-footer">
<span class="login-rights">Samna</span>
</footer>
</body>
</html>
