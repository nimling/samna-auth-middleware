name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build bff artifacts
        env:
          GOPRIVATE: github.com/nimling/*
        run: |
          git config --global url."https://${{ secrets.DOCKER_PACKAGE_READ }}@github.com/".insteadOf "https://github.com/"
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/sauth-bff-linux-amd64 ./cmd/bff
          GOOS=darwin GOARCH=arm64 go build -o dist/sauth-bff-darwin-arm64 ./cmd/bff
          GOOS=darwin GOARCH=amd64 go build -o dist/sauth-bff-darwin-amd64 ./cmd/bff

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: dist/sauth-bff-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Set crate version
        working-directory: ./rust
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i -E "0,/^version = \"[^\"]*\"/ s//version = \"$VERSION\"/" Cargo.toml

      - name: Format
        working-directory: ./rust
        run: cargo fmt --check

      - name: Build
        working-directory: ./rust
        run: cargo build --release

      - name: Test
        working-directory: ./rust
        run: cargo test
